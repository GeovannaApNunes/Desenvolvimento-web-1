<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<script>
    function exFuncao(nome) {
        document.getElementById("cod2").innerHTML = `Nome: ${nome}`;
    }
</script>

<body>
    <h2>Aula sobre JavaScript no HTML</h2>

    <button onclick="alert('Olá Mundo')">Clica Aqui</button>

    <p id="cod1"></p>

    <button onclick="exFuncao('Geovanna')">Disciplina</button>
    <p id="cod2">Disciplina: </p>



    <script>
        document.getElementById("cod1").innerHTML = "Olá Mundo!";
    </script>

</body>

</html>
